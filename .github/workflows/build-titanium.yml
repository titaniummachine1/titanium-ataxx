name: Build Titanium FFI for Botzone
on:
  push:
    branches: [exp/botzone-ffi]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-unknown-linux-gnu
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build titanium-ffi
        run: cargo build --release --target x86_64-unknown-linux-gnu -p titanium-ffi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: titanium_v2.so
          path: target/x86_64-unknown-linux-gnu/release/libtitanium_ffi.so
          retention-days: 7