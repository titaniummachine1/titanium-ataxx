name: Build Titanium Botzone upload
# Builds the Botzone Linux package with Zig for glibc 2.14 (Ubuntu 16.04 compatible).
# No secrets or Botzone credentials are stored or used here; all uploads stay strictly manual/local.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'assets/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked
      - name: Build + check + assemble
        run: python3 tools/build_botzone.py --no-pull --no-test
      - uses: actions/upload-artifact@v4
        with:
          name: botzone-upload
          path: botzone/upload
          retention-days: 3
      - name: Prune old artifacts (keep latest 10)
        uses: actions/github-script@v7
        with:
          script: |
            const res = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const artifacts = res.data.artifacts;
            artifacts.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const toDelete = artifacts.slice(10);
            for (const a of toDelete) {
              console.log(`Pruning old artifact ${a.id} (${a.name}, ${a.created_at})`);
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: a.id
                });
              } catch (err) {
                console.error(`Failed to delete ${a.id}:`, err);
              }
            }
