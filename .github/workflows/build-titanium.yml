name: Build Titanium Botzone upload
# Same build as `python tools/build_botzone.py --no-pull --no-test`: zig for glibc 2.14 (Botzone = Ubuntu 16.04),
# library checked (x86-64 ELF, ti_* exports, glibc <= 2.17), upload folder assembled with MANIFEST.txt.
# No secrets are used; uploading to Botzone stays manual. Download the "botzone-upload" artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked
      - name: Build + check + assemble
        run: python3 tools/build_botzone.py --no-pull --no-test
      - uses: actions/upload-artifact@v4
        with:
          name: botzone-upload
          path: botzone/upload
          retention-days: 14
