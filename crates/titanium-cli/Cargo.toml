[package]
name = "titanium-cli"
version = "0.1.0"
edition = "2021"
description = "Native binary for testing the Titanium Ataxx engine (perft, bench, selfplay, console play)"
license = "MIT"

[[bin]]
name = "titanium-cli"
path = "src/main.rs"

[features]
# exp/tree-shape: titanium-cli treediff (search-tree trace); never in a normal build
trace = ["titanium/trace"]

[dependencies]
titanium = { path = "../titanium" }
